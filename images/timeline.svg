<title id="t">The work that led to Azoth, June 2022 to present</title>
<desc id="d">Cheri, JUL 2022. Arkanum, SEP 2022. RIOT, MAR 2023. RIOT Engine, SEP 2023. RTRI, MAR 2025. RIOT NEXT, OCT 2025. WAVE, JUN 2026. RIOT ran on and off for 3 years 3 months. Azoth, July 2026 to present. Mim, 14 MO. CCMath, 2 YR 6 MO. .NET Console Games, 2 MO. Facade, OCT 2022. Genesis, 5 MO. Snap, 5 MO. Rex Engine, 3 WK. Handmade Hero, 6 MO.</desc>
